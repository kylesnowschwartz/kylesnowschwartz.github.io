<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORST COMMISH EVER</title>
  <style>
    /* === GEOCITIES AESTHETIC WITH MODERN CSS === */

    /* Color palette - straight from 1996 */
    :root {
      --bg-black: #000000;
      --text-red: #ff0000;
      --text-yellow: #ffff00;
      --text-lime: #00ff00;
      --text-cyan: #00ffff;
      --text-magenta: #ff00ff;
      --link-salmon: #ff4c4c;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-black);
      background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(rgba(255,255,255,0.5) 1px, transparent 1px);
      background-size: 100px 100px, 50px 50px, 150px 150px;
      background-position: 0 0, 25px 25px, 75px 50px;
      color: var(--text-red);
      font-family: 'Times New Roman', Times, serif;
      font-size: 16px;
      line-height: 1.4;
      min-height: 100vh;
    }

    a {
      color: var(--link-salmon);
      text-decoration: underline;
    }

    a:visited {
      color: var(--link-salmon);
    }

    a:hover {
      color: var(--text-yellow);
    }

    /* === LAYOUT - Tables vibes via CSS === */
    .page-wrapper {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    /* === HEADER === */
    .site-header {
      text-align: center;
      padding: 20px 0 40px;
    }

    .logo-title {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: clamp(2rem, 8vw, 4rem);
      color: var(--text-yellow);
      text-shadow:
        3px 3px 0 var(--text-red),
        6px 6px 0 #660000;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 1.25rem;
      color: var(--text-lime);
      font-style: italic;
    }

    .established {
      font-size: 0.875rem;
      color: var(--text-cyan);
      margin-top: 10px;
    }

    /* Hit counter */
    .hit-counter {
      margin-top: 20px;
      font-family: 'Courier New', monospace;
      font-size: 0.875rem;
      color: var(--text-yellow);
    }

    .counter-display {
      display: inline-block;
      background: #111;
      border: 2px inset #444;
      padding: 4px 12px;
      font-family: 'Courier New', monospace;
      color: var(--text-lime);
      letter-spacing: 0.2em;
    }

    /* === NAVIGATION === */
    .nav-section {
      text-align: center;
      padding: 20px 0;
      border-top: 2px solid var(--text-magenta);
      border-bottom: 2px solid var(--text-magenta);
      margin-bottom: 30px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 20px;
    }

    .nav-list a {
      display: inline-block;
      padding: 8px 16px;
      background: linear-gradient(180deg, #444 0%, #222 100%);
      border: 2px outset #666;
      color: var(--text-yellow);
      text-decoration: none;
      font-family: 'Arial', sans-serif;
      font-weight: bold;
      font-size: 0.875rem;
      text-transform: uppercase;
    }

    .nav-list a:hover {
      background: linear-gradient(180deg, #555 0%, #333 100%);
      border-style: inset;
      color: var(--text-cyan);
    }

    /* === MARQUEE === */
    .announcement-bar {
      background: var(--text-red);
      color: var(--text-yellow);
      padding: 8px;
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .marquee-content {
      display: inline-block;
      animation: marquee 20s linear infinite;
      white-space: nowrap;
    }

    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* === SECTIONS === */
    .content-section {
      background: rgba(0, 0, 0, 0.7);
      border: 3px ridge var(--text-magenta);
      margin-bottom: 30px;
      padding: 20px;
    }

    .section-title {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 1.75rem;
      color: var(--text-cyan);
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 2px 2px 0 #006666;
      border-bottom: 2px dashed var(--text-cyan);
      padding-bottom: 10px;
    }

    .section-content {
      color: var(--text-yellow);
    }

    /* === DREAM TEAMS === */
    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .team-card {
      background: linear-gradient(180deg, #1a1a2e 0%, #0a0a15 100%);
      border: 2px solid var(--text-magenta);
      padding: 15px;
      text-align: center;
    }

    .team-name {
      font-family: 'Arial Black', sans-serif;
      font-size: 1rem;
      color: var(--text-lime);
      margin-bottom: 5px;
    }

    .team-owner {
      font-size: 0.875rem;
      color: var(--text-cyan);
    }

    .team-record {
      font-size: 0.75rem;
      color: var(--silver);
      margin-top: 5px;
    }

    /* === CHAMPIONSHIP BASEBALL (Hall of Fame) === */
    .champions-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    .champions-table th {
      background: linear-gradient(180deg, var(--gold) 0%, #b8860b 100%);
      color: var(--bg-black);
      padding: 10px;
      text-align: left;
      border: 2px solid var(--gold);
    }

    .champions-table td {
      padding: 8px 10px;
      border: 1px solid #444;
      color: var(--text-yellow);
    }

    .champions-table tr:nth-child(even) {
      background: rgba(255, 215, 0, 0.1);
    }

    .champions-table tr:hover {
      background: rgba(255, 215, 0, 0.2);
    }

    .trophy {
      font-size: 1.5rem;
    }

    /* === WALL OF SHAME === */
    .shame-section {
      border-color: var(--text-red);
    }

    .shame-section .section-title {
      color: var(--text-red);
      text-shadow: 2px 2px 0 #660000;
      border-bottom-color: var(--text-red);
    }

    .shame-list {
      list-style: none;
    }

    .shame-list li {
      padding: 10px;
      border-bottom: 1px dashed #660000;
      color: var(--text-red);
    }

    .shame-list li:last-child {
      border-bottom: none;
    }

    .shame-year {
      color: var(--silver);
      font-size: 0.875rem;
    }

    .shame-reason {
      font-size: 0.875rem;
      color: var(--link-salmon);
      font-style: italic;
    }

    /* === LEAGUE HISTORY === */
    .timeline {
      position: relative;
      padding-left: 30px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 10px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--text-magenta);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 20px;
      padding-left: 20px;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -24px;
      top: 5px;
      width: 12px;
      height: 12px;
      background: var(--text-cyan);
      border-radius: 50%;
      border: 2px solid var(--text-magenta);
    }

    .timeline-year {
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      color: var(--text-lime);
      font-weight: bold;
    }

    .timeline-event {
      color: var(--text-yellow);
      font-size: 0.9375rem;
      margin-top: 5px;
    }

    /* === LEAGUE RULES === */
    .rules-list {
      list-style: none;
      counter-reset: rule-counter;
    }

    .rules-list li {
      counter-increment: rule-counter;
      margin-bottom: 15px;
      padding-left: 40px;
      position: relative;
      color: var(--text-yellow);
    }

    .rules-list li::before {
      content: counter(rule-counter);
      position: absolute;
      left: 0;
      top: 0;
      width: 28px;
      height: 28px;
      background: var(--text-magenta);
      color: var(--bg-black);
      font-weight: bold;
      text-align: center;
      line-height: 28px;
      font-size: 0.875rem;
    }

    .rule-title {
      font-weight: bold;
      color: var(--text-cyan);
      display: block;
      margin-bottom: 5px;
    }

    /* === UNDER CONSTRUCTION === */
    .under-construction {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-yellow);
    }

    .construction-gif {
      font-size: 3rem;
      margin-bottom: 10px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .construction-text {
      font-family: 'Comic Sans MS', 'Arial', sans-serif;
      font-size: 1.25rem;
      color: var(--text-yellow);
    }

    /* === FOOTER === */
    .site-footer {
      text-align: center;
      padding: 30px 20px;
      border-top: 2px solid var(--text-magenta);
      margin-top: 30px;
    }

    .footer-badges {
      margin-bottom: 20px;
    }

    .badge {
      display: inline-block;
      background: #111;
      border: 2px outset #444;
      padding: 5px 10px;
      margin: 5px;
      font-size: 0.75rem;
      color: var(--silver);
    }

    .copyright {
      font-size: 0.75rem;
      color: var(--text-yellow);
    }

    .email-link {
      display: block;
      margin-top: 10px;
      font-size: 0.875rem;
    }

    /* === RESPONSIVE === */
    @media (max-width: 600px) {
      .page-wrapper {
        padding: 10px;
      }

      .content-section {
        padding: 15px;
      }

      .nav-list {
        flex-direction: column;
        align-items: center;
      }

      .teams-grid {
        grid-template-columns: 1fr;
      }

      .champions-table {
        font-size: 0.75rem;
      }

      .champions-table th,
      .champions-table td {
        padding: 6px;
      }
    }

    /* === SPECIAL EFFECTS === */
    .rainbow-text {
      background: linear-gradient(90deg,
        var(--text-red),
        var(--text-yellow),
        var(--text-lime),
        var(--text-cyan),
        var(--text-magenta)
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbow-shift 3s linear infinite;
      background-size: 200% auto;
    }

    @keyframes rainbow-shift {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    /* Starfield fallback if image doesn't load */
    @supports not (background-image: url('images/stars.gif')) {
      body {
        background: radial-gradient(white 1px, transparent 1px),
                    radial-gradient(white 1px, transparent 1px);
        background-size: 50px 50px;
        background-position: 0 0, 25px 25px;
        background-color: var(--bg-black);
      }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">

    <!-- HEADER -->
    <header class="site-header">
      <h1 class="logo-title" id="logo-title"></h1>
      <p class="tagline" id="tagline"></p>
      <p class="established" id="established"></p>

      <div class="hit-counter">
        <span id="visitor-prefix"></span><span class="counter-display">000047</span>
      </div>
    </header>

    <!-- NAVIGATION -->
    <nav class="nav-section">
      <ul class="nav-list" id="nav-list"></ul>
    </nav>

    <!-- MARQUEE ANNOUNCEMENT -->
    <div class="announcement-bar">
      <span class="marquee-content" id="marquee-content"></span>
    </div>

    <!-- DREAM TEAMS -->
    <section id="dream-teams" class="content-section">
      <h2 class="section-title" id="dream-teams-title"></h2>
      <div class="section-content">
        <p style="text-align: center; margin-bottom: 20px;" id="dream-teams-subtitle"></p>
        <div class="teams-grid" id="teams-grid"></div>
      </div>
    </section>

    <!-- CHAMPIONSHIP BASEBALL (Hall of Fame) -->
    <section id="championship" class="content-section">
      <h2 class="section-title" id="championship-title"></h2>
      <div class="section-content">
        <p style="text-align: center; margin-bottom: 20px;" id="championship-subtitle"></p>
        <table class="champions-table">
          <thead id="champions-thead"></thead>
          <tbody id="champions-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- WALL OF SHAME -->
    <section id="wall-of-shame" class="content-section shame-section">
      <h2 class="section-title" id="wall-of-shame-title"></h2>
      <div class="section-content">
        <p style="text-align: center; margin-bottom: 20px; color: var(--link-salmon);" id="wall-of-shame-subtitle"></p>
        <ul class="shame-list" id="shame-list"></ul>
      </div>
    </section>

    <!-- LEAGUE HISTORY -->
    <section id="history" class="content-section">
      <h2 class="section-title" id="history-title"></h2>
      <div class="section-content">
        <p style="text-align: center; margin-bottom: 20px;" id="history-subtitle"></p>
        <div class="timeline" id="timeline"></div>
        <div class="under-construction">
          <div class="construction-gif">&#128218;</div>
          <p class="construction-text" id="history-under-construction"></p>
        </div>
      </div>
    </section>

    <!-- LEAGUE RULES -->
    <section id="rules" class="content-section">
      <h2 class="section-title" id="rules-title"></h2>
      <div class="section-content">
        <p style="text-align: center; margin-bottom: 20px;" id="rules-subtitle"></p>
        <ol class="rules-list" id="rules-list"></ol>
        <div class="under-construction">
          <div class="construction-gif">&#128220;</div>
          <p class="construction-text" id="rules-under-construction"></p>
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="site-footer">
      <div class="footer-badges" id="footer-badges"></div>
      <p class="copyright" id="footer-copyright"></p>
      <a href="" class="email-link" id="footer-contact"></a>
    </footer>

  </div>

  <!-- Content CMS -->
  <script src="content.js"></script>
  <script src="data.js"></script>
  <script>
    // === RENDER SITE FROM CONTENT ===

    // Helper to set text content by ID
    const setText = (id, text) => {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    };

    // Helper to set innerHTML by ID
    const setHTML = (id, html) => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = html;
    };

    // Site header
    document.title = CONTENT.site.title;
    setText('logo-title', CONTENT.site.logoTitle);
    setText('tagline', CONTENT.site.tagline);
    setText('established', CONTENT.site.established);
    setText('visitor-prefix', CONTENT.site.visitorPrefix);

    // Navigation
    setHTML('nav-list', CONTENT.nav.map(item =>
      `<li><a href="${item.href}">${item.label}</a></li>`
    ).join(''));

    // Marquee
    setText('marquee-content', CONTENT.marquee);

    // Dream Teams section
    setText('dream-teams-title', CONTENT.sections.dreamTeams.title);
    setText('dream-teams-subtitle', CONTENT.sections.dreamTeams.subtitle);
    setHTML('teams-grid', TEAMS.map(team => `
      <div class="team-card">
        <div class="team-name">${team.name}</div>
        <div class="team-owner">Owner: ${team.manager}</div>
        <div class="team-record">${CURRENT_YEAR} Record: ${team.wins}-${team.losses}</div>
      </div>
    `).join(''));

    // Championship section
    setText('championship-title', CONTENT.sections.championship.title);
    setText('championship-subtitle', CONTENT.sections.championship.subtitle);
    setHTML('champions-thead', `<tr>${CONTENT.sections.championship.tableHeaders.map(h =>
      `<th>${h}</th>`
    ).join('')}</tr>`);

    const years = Object.keys(LEAGUE_DATA).map(Number).sort((a, b) => b - a);
    setHTML('champions-tbody', years.map(year => {
      const d = LEAGUE_DATA[year];
      const rowClass = d.missing ? 'style="opacity: 0.4; font-style: italic;"' : '';
      const trophy = d.missing ? '?' : '&#127942;';
      return `
        <tr ${rowClass}>
          <td>${year}</td>
          <td>${d.championMgr}</td>
          <td>${d.champion}</td>
          <td>${d.record}</td>
          <td class="trophy">${trophy}</td>
        </tr>
      `;
    }).join(''));

    // Wall of Shame section
    setText('wall-of-shame-title', CONTENT.sections.wallOfShame.title);
    setText('wall-of-shame-subtitle', CONTENT.sections.wallOfShame.subtitle);
    setHTML('shame-list', years.map(year => {
      const d = LEAGUE_DATA[year];
      const style = d.missing ? 'style="opacity: 0.4; font-style: italic;"' : '';
      return `
        <li ${style}>
          <span class="shame-year">${year}:</span>
          <strong>${d.lastPlaceMgr}</strong> -
          <span class="shame-reason">"${d.lastPlace}"</span>
        </li>
      `;
    }).join(''));

    // History section
    setText('history-title', CONTENT.sections.history.title);
    setText('history-subtitle', CONTENT.sections.history.subtitle);
    setText('history-under-construction', CONTENT.sections.history.underConstruction);
    setHTML('timeline', CONTENT.sections.history.timeline.map(item => {
      let eventHTML = item.event;
      if (item.rainbow && item.prefix) {
        eventHTML = `<span class="rainbow-text">${item.prefix}</span> ${item.event}`;
      }
      return `
        <div class="timeline-item">
          <div class="timeline-year">${item.year}</div>
          <div class="timeline-event">${eventHTML}</div>
        </div>
      `;
    }).join(''));

    // Rules section
    setText('rules-title', CONTENT.sections.rules.title);
    setText('rules-subtitle', CONTENT.sections.rules.subtitle);
    setText('rules-under-construction', CONTENT.sections.rules.underConstruction);
    setHTML('rules-list', CONTENT.sections.rules.rules.map(rule => `
      <li>
        <span class="rule-title">${rule.title}</span>
        ${rule.description}
      </li>
    `).join(''));

    // Footer
    setHTML('footer-badges', CONTENT.footer.badges.map(badge =>
      `<span class="badge">${badge}</span>`
    ).join(''));
    setHTML('footer-copyright',
      `&copy; ${CONTENT.footer.copyright}<br>${CONTENT.footer.copyrightNote}`
    );
    const contactLink = document.getElementById('footer-contact');
    if (contactLink) {
      contactLink.href = `mailto:${CONTENT.footer.contactEmail}`;
      contactLink.textContent = CONTENT.footer.contactText;
    }

    // Fake hit counter
    (function() {
      const counter = document.querySelector('.counter-display');
      if (counter) {
        let visits = parseInt(localStorage.getItem('wce_visits') || '46', 10);
        visits++;
        localStorage.setItem('wce_visits', visits.toString());
        counter.textContent = visits.toString().padStart(6, '0');
      }
    })();
  </script>

</body>
</html>
